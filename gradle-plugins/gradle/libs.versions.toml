# These have to agree with the consumers' own catalogs. The detekt plugin is applied by
# binge.gates.detekt at this version, and the Kotlin Gradle plugin is compiled against here and
# supplied at run time by the consumer's build, so a disagreement surfaces in a consumer's build.
[versions]
detekt = "1.23.8"
kotlin = "2.4.20"
junit5 = "6.1.3"

[libraries]
detekt-gradlePlugin = { module = "io.gitlab.arturbosch.detekt:detekt-gradle-plugin", version.ref = "detekt" }
kotlin-gradlePlugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
junit-jupiter-api = { module = "org.junit.jupiter:junit-jupiter-api", version.ref = "junit5" }
junit-jupiter-engine = { module = "org.junit.jupiter:junit-jupiter-engine", version.ref = "junit5" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit5" }
