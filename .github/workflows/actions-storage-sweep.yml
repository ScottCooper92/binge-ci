name: Actions storage sweep

# A repository's Actions caches and artifacts count against one quota, and GitHub evicts by last
# access only once it is full. Gradle caches are 1 to 3.5 GB each, so a few pushes fill it and the
# eviction then removes the entries the next build wanted. This deletes what has not been touched
# for a while, on a schedule the caller owns.
#
# An artifact is deleted by age too, not wholesale: a run that is still going has one a bot is
# about to download by name. It goes whatever retention its uploader asked for, so a repository that
# keeps a long-lived artifact on purpose should not run this against it.

on:
  workflow_call:
    inputs:
      runner:
        description: >
          runs-on, as a JSON array string. Defaults to a GitHub-hosted runner. The job is a few `gh api`
          calls, so a repository that keeps its jobs off hosted runners points this at a light one.
        type: string
        default: '["ubuntu-latest"]'
      max_age_days:
        description: Delete caches not accessed, and artifacts not created, in this many days.
        type: number
        default: 3
      cache_max_age_days:
        description: >
          Delete caches not accessed in this many days, when it should differ from `max_age_days`. A
          repository that keeps artifacts a week on purpose sets `max_age_days: 7` and a shorter value
          here. 0 uses `max_age_days`.
        type: number
        default: 0
      dry_run:
        description: Log what would be deleted and delete nothing.
        type: boolean
        default: false
      keep_cache_key_prefixes:
        description: >
          Space-separated cache key prefixes the sweep leaves alone. The default keeps the emulator image
          cache: a weekly lane restores it, never saves it, and a sweep a day before the run would
          otherwise delete it every week.
        type: string
        default: 'gmd-avd-'

permissions:
  actions: write

concurrency:
  group: actions-storage-sweep-${{ github.repository }}
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ${{ fromJSON(inputs.runner) }}
    timeout-minutes: 15
    steps:
      - name: Delete stale caches
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          MAX_AGE_DAYS: ${{ inputs.cache_max_age_days > 0 && inputs.cache_max_age_days || inputs.max_age_days }}
          DRY_RUN: ${{ inputs.dry_run }}
          KEEP_PREFIXES: ${{ inputs.keep_cache_key_prefixes }}
        run: |
          set -euo pipefail
          cutoff=$(date -u -d "${MAX_AGE_DAYS} days ago" +%Y-%m-%dT%H:%M:%S)
          keep=""
          for prefix in $KEEP_PREFIXES; do keep="${keep:+${keep}|}${prefix}"; done
          # A key matching no prefix is the only one swept. An empty list matches nothing.
          not_kept='true'
          [ -z "$keep" ] || not_kept="(.key | test(\"^(${keep})\") | not)"
          # Timestamps are cut to the second so the comparison is a plain string one.
          rows=$(gh api --paginate "repos/${REPO}/actions/caches?per_page=100" \
            --jq ".actions_caches[] | select(.last_accessed_at[0:19] < \"${cutoff}\" and ${not_kept}) | [.id, .size_in_bytes, .key] | @tsv")
          count=0
          bytes=0
          while IFS=$'\t' read -r id size key; do
            [ -n "$id" ] || continue
            if [ "$DRY_RUN" = "true" ]; then
              echo "Would delete cache ${id} (${size} bytes): ${key}"
            else
              # Gone already: evicted since the list was read, or deleted by an overlapping run.
              out=$(gh api -X DELETE "repos/${REPO}/actions/caches/${id}" 2>&1) || grep -q "HTTP 404" <<<"$out" || { echo "$out" >&2; exit 1; }
              echo "Deleted cache ${id} (${size} bytes): ${key}"
            fi
            count=$((count + 1))
            bytes=$((bytes + size))
          done <<<"$rows"
          verb="Deleted"
          [ "$DRY_RUN" = "true" ] && verb="Would delete"
          echo "${verb} ${count} caches, $((bytes / 1048576)) MiB, last accessed before ${cutoff}Z." | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Delete stale artifacts
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          MAX_AGE_DAYS: ${{ inputs.max_age_days }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          cutoff=$(date -u -d "${MAX_AGE_DAYS} days ago" +%Y-%m-%dT%H:%M:%S)
          rows=$(gh api --paginate "repos/${REPO}/actions/artifacts?per_page=100" \
            --jq ".artifacts[] | select(.expired == false and .created_at[0:19] < \"${cutoff}\") | [.id, .size_in_bytes, .name] | @tsv")
          count=0
          bytes=0
          while IFS=$'\t' read -r id size name; do
            [ -n "$id" ] || continue
            if [ "$DRY_RUN" = "true" ]; then
              echo "Would delete artifact ${id} (${size} bytes): ${name}"
            else
              # Gone already: evicted since the list was read, or deleted by an overlapping run.
              out=$(gh api -X DELETE "repos/${REPO}/actions/artifacts/${id}" 2>&1) || grep -q "HTTP 404" <<<"$out" || { echo "$out" >&2; exit 1; }
              echo "Deleted artifact ${id} (${size} bytes): ${name}"
            fi
            count=$((count + 1))
            bytes=$((bytes + size))
          done <<<"$rows"
          verb="Deleted"
          [ "$DRY_RUN" = "true" ] && verb="Would delete"
          echo "${verb} ${count} artifacts, $((bytes / 1048576)) MiB, created before ${cutoff}Z." | tee -a "$GITHUB_STEP_SUMMARY"
