name: Bot review (this repo)

# Which PR this run is for. A workflow_run run is attributed to the default branch, so without
# this every run of this workflow carries the same branch and the same title, and telling two
# apart means opening one. run-name is evaluated before any job, so it cannot use the number the
# called workflow resolves - it comes off the event, and falls back to the head branch, which is
# what that resolution looks the PR up by anyway.
run-name: >-
  ${{ github.event.workflow_run.pull_requests[0].number
        && format('#{0} · {1}', github.event.workflow_run.pull_requests[0].number, github.event.workflow_run.head_branch)
      || github.event.pull_request.number
        && format('#{0} · {1}', github.event.pull_request.number, github.event.pull_request.head.ref)
      || inputs.pr && format('#{0} · dispatched', inputs.pr)
      || github.event.workflow_run.head_branch
      || github.ref_name }}

# This repository's own caller: the same shape as callers/binge-integrations, pointed at the
# workflow this repository ships. Pinned to the release tag the actions pin, NOT `./`: a PR here
# is reviewed by the reviewer that consumers run, never by the one it is changing, and a `./`
# reference would fail tools/check-internal-refs.sh in any case. A fix to bot-review.yml
# reaches this repo's own PRs the way it reaches everyone's - at the next release.
#
# PUBLIC repository. The same-repository guard inside the called workflow is the whole
# boundary here rather than a second line of defence, and the `agent` label is
# maintainers-only for the same reason. Do not add a `pull_request_target` path.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      pr:
        description: PR number to review
        required: true

# The called workflow needs `actions: read` for its CI-run lookup, and a caller has to hold a
# permission before it can pass it on - see README.md, "Writing a caller".
permissions:
  contents: read
  actions: read
  # For the check run the called workflow posts with GITHUB_TOKEN when its first job fails
  # before the reviewer app's token exists - the one report that cannot use the app.
  checks: write

jobs:
  review:
    uses: ScottCooper92/binge-ci/.github/workflows/bot-review.yml@v1.0.7
    with:
      dispatch_pr: ${{ inputs.pr }}
      # Everything in this repository governs the agents, so a merge here is a human's
      # decision: the review runs, the verdict lands, and the merge button stays manual.
      auto_merge: false
      # ci.yml here has no paths-ignore, so every PR produces a run and unbuilt_paths stays
      # unset. The `labeled` trigger above is for the door's other case: a PR labelled after
      # its run already finished.
      gated_checks: >-
        actionlint (with shellcheck) over the workflows and callers, shellcheck over the
        governed-paths script, and tools/check-callers.sh, tools/check-action-shell.sh and
        tools/check-internal-refs.sh
    secrets:
      REVIEWER_APP_ID: ${{ secrets.REVIEWER_APP_ID }}
      REVIEWER_APP_PRIVATE_KEY: ${{ secrets.REVIEWER_APP_PRIVATE_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
