name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # check-callers.sh reads each self caller's workflow at the tag it pins.
          fetch-tags: true

      # actionlint shellchecks every `run:` block, but only when shellcheck is on PATH.
      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck

      - name: actionlint
        env:
          VERSION: 1.7.7
          SHA256: 023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757
        run: |
          set -euo pipefail
          curl -sSLo actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/actionlint_${VERSION}_linux_amd64.tar.gz"
          echo "${SHA256}  actionlint.tar.gz" | sha256sum -c -
          tar xzf actionlint.tar.gz actionlint
          # --severity=warning, not the default: info fires SC2016 on every `printf` format
          # string here, where single quotes are correct. Disabling SC2016 outright would
          # also drop the real case, so the floor is set by severity.
          #
          # Two invocations because a caller's `uses:` is a remote ref actionlint cannot
          # resolve from inside a PR; check-callers.sh covers what it therefore skips.
          ./actionlint -shellcheck 'shellcheck --severity=warning' .github/workflows/*.yml
          ./actionlint -shellcheck 'shellcheck --severity=warning' callers/*/*.yml

      - name: Check the draft callers against the workflows they call
        run: ./tools/check-callers.sh

      # Pointed at an action.yml, actionlint reports "on section is missing" and stops, so
      # a composite action's shell is never checked by the runs above.
      - name: shellcheck the composite actions
        run: ./tools/check-action-shell.sh

      # actionlint validates a `uses:` it can resolve, which a self-reference at a tag is not
      # from inside a PR. This covers the two ways one goes wrong here.
      - name: Check this repo's references to its own actions
        run: ./tools/check-internal-refs.sh

      # Plain files, so no `run:` block carries them into the checks above. The tools are
      # the checks themselves: one of them passing silently is a gate that is not there.
      - name: shellcheck the governed-paths script and the tools
        run: shellcheck --severity=warning .github/actions/governed-paths/restore-agent-governed-paths.sh tools/*.sh

      # GitHub loads `.yaml` as readily as `.yml`, but every glob in this repo - actionlint's
      # above and the three tools' - reads `.yml` only, so a workflow or caller added as
      # `.yaml` would run in production having been seen by no check. Rather than widen four
      # globs and keep them in step, the convention is enforced.
      - name: Workflows and callers are .yml
        run: |
          set -euo pipefail
          found=$(find .github callers -type f -name '*.yaml')
          if [ -n "$found" ]; then
            echo "::error::These are invisible to every check here; rename them to .yml:"
            printf '%s\n' "$found"
            exit 1
          fi
