name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # check-callers.sh reads each self caller's workflow at the tag it pins.
          fetch-tags: true

      # For the plain-file shellcheck steps below. The actionlint action installs it too when it is
      # missing, so this also saves it the apt round-trip. python3-yaml is for the fork-review test.
      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck python3-yaml

      # The same pinned, checksum-verified actionlint the consumers run, with shellcheck at
      # --severity=warning. Two calls because a caller's `uses:` is a remote ref actionlint cannot
      # resolve from inside a PR; check-callers.sh covers what it therefore skips.
      #
      # From this checkout, not the release tag. A release PR pins the tag it is about to create,
      # which does not exist until after the merge, so a tag here failed every release PR at "Set up
      # job". This also lints with the action as the PR has it. ci.yml is not a reusable workflow,
      # so `./` is this repository's own workspace; check-internal-refs.sh bans it only where it is not.
      - name: actionlint over the workflows
        uses: ./.github/actions/actionlint
        with:
          args: .github/workflows/*.yml

      - name: actionlint over the callers
        uses: ./.github/actions/actionlint
        with:
          args: callers/*/*.yml

      - name: Check the draft callers against the workflows they call
        run: ./tools/check-callers.sh

      # Pointed at an action.yml, actionlint reports "on section is missing" and stops, so
      # a composite action's shell is never checked by the runs above.
      - name: shellcheck the composite actions
        run: ./tools/check-action-shell.sh

      # actionlint has no schema for an action.yml, so an `${{ env.X }}` that nothing sets reads
      # as empty in production and passes every check above.
      - name: Check the composite actions' env references
        run: ./tools/check-action-env.sh

      # actionlint validates a `uses:` it can resolve, which a self-reference at a tag is not
      # from inside a PR. This covers the two ways one goes wrong here.
      - name: Check this repo's references to its own actions
        run: ./tools/check-internal-refs.sh

      - name: Test the references check against its fixtures
        run: ./tools/test-internal-refs.sh

      # A token mint that asks for a permission its app's installation lacks fails at run time, in
      # every consumer at once, and nothing above can see an installation's grant.
      - name: Check the token mints against the apps' grants
        run: ./tools/check-token-permissions.sh

      - name: Test the token check against its fixtures
        run: ./tools/test-token-permissions.sh

      # `buildable` decides whether bot-review may treat a PR as one CI never builds, and with
      # merge_unbuilt on, merge it with no build behind it.
      - name: Test the merge guards against their fixtures
        run: ./tools/test-merge-guards.sh

      # The governed-paths script's notes and markers are read by other steps: the merge gate holds
      # on one, the author bots caveat their reply on another. Nothing else runs it outside a PR.
      - name: Test the governed-paths script against its fixtures
        run: ./tools/test-governed-paths.sh

      # The pin check is inline in a reusable workflow, so only a consumer's PR would run it.
      - name: Test the submodule-pin check against scratch repositories
        run: ./tools/test-submodule-pins.sh

      # fork-review.yml runs a fork's PR through a job that holds a secret, so what keeps the two
      # apart is tested rather than read: no checkout, no interpolation in a `run:`, a read-only
      # agent, and the one function both of its stages run.
      - name: Test the fork-review workflow's safety properties and its shared function
        run: ./tools/test-fork-review.sh

      # Plain files, so no `run:` block carries them into the checks above. The tools are
      # the checks themselves: one of them passing silently is a gate that is not there.
      - name: shellcheck the action scripts and the tools
        run: shellcheck --severity=warning .github/actions/*/*.sh tools/*.sh

      # GitHub loads `.yaml` as readily as `.yml`, but every glob in this repo - actionlint's
      # above and the three tools' - reads `.yml` only, so a workflow or caller added as
      # `.yaml` would run in production having been seen by no check. Rather than widen four
      # globs and keep them in step, the convention is enforced.
      - name: Workflows and callers are .yml
        run: |
          set -euo pipefail
          found=$(find .github callers -type f -name '*.yaml')
          if [ -n "$found" ]; then
            echo "::error::These are invisible to every check here; rename them to .yml:"
            printf '%s\n' "$found"
            exit 1
          fi

  # The shared Gradle gates are code every consumer's build runs, so they get a build of their own:
  # compile, plugin validation and the tests: each gate against the cases it must pass and fail.
  # The detekt gate's Android case builds against the runner's own SDK, through ANDROID_HOME.
  gradle-plugins:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: gradle-plugins
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # JDK 17 because the consumers build on it, and the plugins run inside their builds.
      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      # Also validates the wrapper jar's checksum, which matters for a jar copied in by hand.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          cache-cleanup: on-success

      - name: Build the Gradle gates
        run: |
          set -euo pipefail
          ./gradlew build

      # Gradle's console names a failed test's exception class but not its message; the reports
      # carry it. The CI-fix bot reads this artifact by name (self-ci-fix.yml, reports_artifact),
      # so a red TestKit test reaches it with the assertion that failed. Two paths, not one: the
      # artifact is rooted at their common parent, and the bot looks for `reports/tests/` in it.
      - name: Upload the test reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gradle-plugins-reports
          path: |
            gradle-plugins/build/reports
            gradle-plugins/build/test-results
          if-no-files-found: ignore
          retention-days: 3
