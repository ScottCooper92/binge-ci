name: Tag check

# Catches the release mistakes nothing else can: bumping the self-referenced tag and never
# cutting it, tagging a commit whose references still name the previous release, or moving
# `v1` to a commit other than the one the pinned tag names. In each case the workflows name a
# ref that does not exist, or resolve their actions from a different commit than the one
# they shipped with, and every consumer's next agent run dies on "unable to resolve action".
#
# It cannot be a PR check - the tag is created after the merge that names it - so it runs on
# a tag push, which is when the mistake is made: moving `v1` is itself a tag push. It ALSO
# runs on every push to main, because the mistake that has actually happened, twice, is
# merging the bump and never tagging at all, and no tag push follows that to fire on. Between
# the bump merging and the tag being cut, main genuinely names a tag that does not exist, so
# this is red for that window; that red is the report, and it clears when the tag is pushed.
# On main it also requires the pinned tag's own tree to pin that same tag, which catches a bump
# to a tag already cut at an older commit: no tag push follows that one either.
#
# It DETECTS rather than prevents. By the time a tag push fails here, `v1` has already moved
# and consumers are already broken; it turns a silent breakage into a loud one and shortens
# the window. A green run here is not evidence the window never opened.
on:
  push:
    tags: ['v*']
    branches: [main]

permissions:
  contents: read

jobs:
  refs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The tags, so the pinned tag's own tree can be read. The script fetches the one it needs
      # if this does not bring it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-tags: true
      - name: Every self-referenced tag must exist, and name this release
        env:
          # The ref and commit of this push. On main the tag must exist and pin itself; on a
          # vX.Y.Z push the tag must be the one pinned; on a `v1` move the commit must be
          # the one the pinned tag names.
          PUSHED_REF: ${{ github.ref_name }}
          PUSHED_SHA: ${{ github.sha }}
        run: ./tools/check-internal-refs.sh --resolve
