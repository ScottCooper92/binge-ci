name: Tag check

# Catches the one release mistake nothing else can: bumping the self-referenced tag, moving
# `v1`, and never cutting the tag. The workflows then name a ref that does not exist, and
# every consumer's next agent run dies on "unable to resolve action".
#
# It cannot be a PR check - the tag is created after the merge that names it - so it runs on
# a tag push, which is when the mistake is made: moving `v1` is itself a tag push.
#
# It DETECTS rather than prevents. By the time this fails, `v1` has already moved and
# consumers are already broken; it turns a silent breakage into a loud one and shortens the
# window. A green run here is not evidence the window never opened.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  refs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Every self-referenced tag must exist
        run: ./tools/check-internal-refs.sh --resolve
