name: Author - catch up a retargeted PR

# Catches a stranded PR up to the default branch, and retargets one opened onto a
# base that had already merged.
#
# A squash-merged parent retargets its child by firing `pull_request` action
# `edited` - not a CI trigger type - so no CI run and therefore no review. And
# author-conflicts does not cover it: it acts on `dirty` PRs, and a squash-merged
# parent leaves the child CLEAN.
#
# A merge rather than a rebase, because it both collapses the diff to the PR's own
# changes and fires `synchronize`, which is the CI trigger and so the review
# trigger. A rebase would need a force-push over the author bot's own commits.
#
# THE CALLER MUST USE `pull_request_target`, not `pull_request`, and it is
# load-bearing. A `pull_request` workflow is read from the PR's HEAD branch, so it
# can never run for a PR whose branch predates it - circular, because the branch
# acquires it by the very merge this performs. `pull_request_target` is read from
# the BASE branch and runs regardless of what the branch carries.
#
# That trigger is dangerous when a workflow EXECUTES checked-out PR code with the
# base repo's secrets in scope. This job runs `git merge` and `git push` and
# nothing else. Do not add an execution step here.
#
# The caller must NOT add a `concurrency:` block; this workflow has one.
on:
  workflow_call:
    inputs:
      runner:
        description: >
          runs-on, as a JSON array string. Defaults to a GitHub-hosted runner. This job
          runs no agent and builds nothing, so it has no reason to want a self-hosted one.
        type: string
        default: '["ubuntu-latest"]'
      default_branch:
        description: The branch a stranded PR is caught up to, and retargeted onto.
        type: string
        default: main
      agent_label:
        type: string
        default: agent
      author_bot:
        type: string
        default: binge-pr-author[bot]
      author_bot_id:
        description: >
          The author app's bot user id, for the commit author address. Passed from the
          caller's AUTHOR_BOT_ID repository variable — a reusable workflow cannot read
          the caller's `vars` context.
        type: string
        required: true
      timeout_minutes:
        type: number
        default: 10
    secrets:
      AUTHOR_APP_ID:
        required: true
      AUTHOR_APP_PRIVATE_KEY:
        required: true

permissions:
  contents: read

concurrency:
  # These triggers can arrive seconds apart, and two runs pushing one branch is a lost
  # update. NOT cancel-in-progress: a merge cancelled before its push leaves nothing
  # behind, but cancelling the winner would.
  group: author-retarget-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  catch-up:
    # Two shapes. Base IS the default branch: something retargeted this PR, and
    # `changes.base` is what makes an `edited` a retarget and not a title tweak. Base is
    # NOT: opened or labelled onto another branch, which needs an API call to judge, so
    # the step below decides. `edited` is excluded there - a human restacking
    # deliberately is not this bot's business.
    if: >
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      ((github.event.pull_request.base.ref == inputs.default_branch &&
        (github.event.action == 'ready_for_review' || github.event.changes.base != null)) ||
       (github.event.pull_request.base.ref != inputs.default_branch &&
        github.event.action != 'edited'))
    runs-on: ${{ fromJSON(inputs.runner) }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    steps:
      - name: Mint author app token
        id: token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.AUTHOR_APP_ID }}
          private-key: ${{ secrets.AUTHOR_APP_PRIVATE_KEY }}

      - name: Check the PR is opted in
        id: gate
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          AGENT_LABEL: ${{ inputs.agent_label }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # From the API, not the payload: on a retarget the payload is a snapshot from
          # before whatever else has happened since, and this check grants writes.
          labels=$(gh pr view "$PR" --json labels --jq '[.labels[].name] | join(",")')
          if ! echo ",$labels," | grep -q ",$AGENT_LABEL,"; then
            echo "PR #$PR is not labelled '$AGENT_LABEL' - leaving it alone."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      # A base that is not the default branch is usually a LIVE stack. Its own PR is the
      # discriminator: no open PR means nothing will ever land it, and requiring a MERGED
      # one keeps this off branches that were never a stack.
      #
      # Carries on into the merge rather than relying on the resulting `edited` to
      # re-enter - it would, since an app token fires events, but a fix that depends on
      # its own trigger fails silently when it does not.
      - name: Retarget a PR opened onto a base that already merged
        id: restack
        if: steps.gate.outputs.skip != 'true' && github.event.pull_request.base.ref != inputs.default_branch
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ inputs.default_branch }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # The live base, not the payload: `cancel-in-progress: false` means a queued run
          # carries a snapshot from before an earlier run retargeted this PR, and trusting
          # it would redo the retarget and re-post the comment.
          BASE=$(gh pr view "$PR" --json baseRefName --jq .baseRefName) \
            || { echo "::error::Could not read PR #$PR's current base."; exit 1; }
          if [ "$BASE" = "$DEFAULT_BRANCH" ]; then
            echo "PR #$PR is already based on $DEFAULT_BRANCH - a concurrent run must have caught it."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Assigned and guarded, not tested inline: a command substitution that fails
          # inside `[ ]` does not trip `set -e`, so a dead token would read as "this base
          # has no PR" and leave a stranded PR stranded - the fault being fixed here.
          open_pr=$(gh pr list --state open --head "$BASE" --json number --jq '.[].number') \
            || { echo "::error::Could not list open PRs for base '$BASE'."; exit 1; }
          merged_pr=$(gh pr list --state merged --head "$BASE" --json number --jq '.[].number') \
            || { echo "::error::Could not list merged PRs for base '$BASE'."; exit 1; }

          if [ -n "$open_pr" ]; then
            echo "PR #$PR is stacked on '$BASE', which still has an open PR - the stack is live."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$merged_pr" ]; then
            echo "::warning::PR #$PR is based on '$BASE', which has no PR of its own, open or merged. Not a stack this workflow understands - leaving it alone."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh pr edit "$PR" --base "$DEFAULT_BRANCH"
          printf 'Retargeted this PR to `%s`. Its base, `%s`, had already merged and been deleted, so nothing was ever going to land underneath it and the PR could not merge through the stack.\n\nThe diff now shows every commit on this branch that is not on `%s` - which may be more than you intended if the branch was cut from a stale copy of `%s`.\n' \
            "$DEFAULT_BRANCH" "$BASE" "$DEFAULT_BRANCH" "$BASE" | gh pr comment "$PR" --body-file -
          echo "Retargeted PR #$PR from '$BASE' to $DEFAULT_BRANCH."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.gate.outputs.skip != 'true' && steps.restack.outputs.skip != 'true'
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ steps.token.outputs.token }}

      - name: Merge the base in, if the branch is behind
        if: steps.gate.outputs.skip != 'true' && steps.restack.outputs.skip != 'true'
        env:
          AUTHOR_BOT: ${{ inputs.author_bot }}
          AUTHOR_BOT_ID: ${{ inputs.author_bot_id }}
          DEFAULT_BRANCH: ${{ inputs.default_branch }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          [ -n "${AUTHOR_BOT_ID:-}" ] \
            || { echo "::error::The author_bot_id input is empty - the caller's AUTHOR_BOT_ID variable is unset."; exit 1; }
          git config user.name "$AUTHOR_BOT"
          git config user.email "${AUTHOR_BOT_ID}+${AUTHOR_BOT}@users.noreply.github.com"

          # Guarded: an unnoticed fetch failure merges a stale ref and reports success.
          git fetch origin "$DEFAULT_BRANCH" \
            || { echo "::error::Could not fetch origin/$DEFAULT_BRANCH."; exit 1; }

          # The common case, since most edits are a title or body. An empty merge would
          # spend a CI run to say nothing.
          if git merge-base --is-ancestor "origin/$DEFAULT_BRANCH" HEAD; then
            echo "PR #$PR already contains origin/$DEFAULT_BRANCH - nothing to catch up."
            exit 0
          fi

          if git merge "origin/$DEFAULT_BRANCH" --no-edit; then
            git push || { echo "::error::Merged $DEFAULT_BRANCH cleanly but the push was rejected."; exit 1; }
            echo "Caught PR #$PR up to $DEFAULT_BRANCH; the push will trigger CI and, with it, review."
          else
            # A real conflict is author-conflicts' job, on the next CI run.
            git merge --abort || true
            echo "::warning::PR #$PR conflicts with $DEFAULT_BRANCH; left for author-conflicts."
          fi

      # A failure here silently restores the exact condition this workflow removes: the PR
      # left waiting on nobody.
      #
      # always(), not failure(), to catch a cancel by timeout-minutes. Gated on the opt-in
      # check having SUCCEEDED and admitted the PR - if that step is what broke, the label
      # was never read, and commenting on a PR that may not carry it is worse than silence.
      - name: Report a failed catch-up
        if: >
          always() && job.status != 'success' &&
          steps.gate.outcome == 'success' && steps.gate.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ inputs.default_branch }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          marker="<!-- retarget-failed:${SHA} -->"
          comments=$(gh api "repos/${GH_REPO}/issues/${PR}/comments?per_page=100" \
            --paginate --jq '.[].body')
          if ! grep -qF "$marker" <<<"$comments"; then
            printf '%s\nThis PR needed catching up to `%s` - retargeted, promoted, or opened onto a base that had already merged - and I could not do it: the workflow run itself failed ([log](%s)). Nothing was pushed, so no CI run and no review will follow on its own. Merging `%s` in by hand will start it moving again.\n' \
              "$marker" "$DEFAULT_BRANCH" "$RUN_URL" "$DEFAULT_BRANCH" | gh pr comment "$PR" --body-file -
          fi
