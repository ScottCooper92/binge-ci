name: Consumer check

# Compiles a public consumer against the calling PR's head, for a repository the consumer includes
# as a submodule composite build. A green build in the included repository says nothing about the
# build that includes it: a changed public signature is otherwise noticed only by the bump PR that
# arrives after it merged.
#
# INFORMATIONAL. The caller gives it a workflow of its own, not named `CI`: bot-review, author-ci-fix
# and author-conflicts match that name, and this check can go red for a reason that has nothing to do
# with the diff, or for exactly the reason an intended signature change should. Keep it out of branch
# protection too. Informational is not the same as no effect on merging, though: bot-review's
# auto-merge reads the PR's merge state, and a failing or running check here holds it at UNSTABLE.
#
# The swap finds its target in the consumer's `.gitmodules`: the submodule whose URL is the calling
# repository. Nothing here assumes what that directory is called, so a consumer that renames it needs
# no change on either side. Every other submodule of the consumer is checked out at its own pin.
#
# It compiles what `tasks` names and nothing else. The consumer's lint, unit tests and screenshot
# baselines say little about the change being checked, and made the job take over twenty minutes. The
# caller should also run it on pushes to its default branch: setup-gradle saves its cache only there,
# so a job that ran on pull requests alone would start cold every time.
#
# A private consumer needs a token this does not take; it is out of scope. `private_submodules` covers the
# calling repository's own checkout only, not the consumer's other submodules.
on:
  workflow_call:
    inputs:
      private_submodules:
        description: >
          Names of private repositories, comma- or newline-separated and under the caller's owner, that the
          checkout fetches as git submodules. Empty (the default) changes nothing. When set, the checkout
          uses a GitHub App token that can read the caller and these repositories, so the app must be
          installed on every one of them.
        type: string
        default: ''
      runner:
        description: runs-on, as a JSON array string.
        type: string
        default: '["ubuntu-latest"]'
      consumer:
        description: owner/name of the public consumer to compile.
        type: string
        required: true
      consumer_ref:
        description: The consumer's branch to compile.
        type: string
        default: main
      tasks:
        description: >
          The Gradle tasks to run in the consumer, space-separated. Compile tasks, as a rule:
          `:app:compileDebugKotlin :app:compileDebugUnitTestKotlin`.
        type: string
        required: true
      java_version:
        description: The JDK the consumer builds on, which need not be the caller's own.
        type: string
        default: '21'
      timeout_minutes:
        type: number
        default: 45
      gradle_cache_read_only:
        description: >
          Restore the Gradle cache without saving one. When false, setup-gradle's own default applies (save
          on the default branch, restore only on the rest). Default true: the caller's own CI job is the one
          writer, and a second copy of the Gradle home costs 1 to 3.5 GB of the repository's cache quota
          on every push to the default branch. Set false only in a repository where this is its only
          Gradle job.
        type: boolean
        default: true
    secrets:
      REVIEWER_APP_ID:
        description: Only read when `private_submodules` is set, to mint the read-only submodule token.
        required: false
      REVIEWER_APP_PRIVATE_KEY:
        required: false

permissions:
  contents: read

# Keyed on the consumer as well, so a caller can check two consumers side by side. Without it the second call
# cancels the first, and the caller has to run them in order.
concurrency:
  group: consumer-check-${{ github.repository }}-${{ inputs.consumer }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ${{ fromJSON(inputs.runner) }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    steps:
      - name: Name the calling repository
        id: repo
        if: inputs.private_submodules != ''
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          # A `schedule` run carries no `repository` in its event payload, so the name comes from the context.
          echo "name=${REPOSITORY#*/}" >> "$GITHUB_OUTPUT"

      # A separate, read-only token: this job only reads the checkout. The caller is listed too, because
      # `repositories` replaces the default scope of the caller alone.
      - name: Mint a read-only token for private submodules
        id: submodule_token
        if: inputs.private_submodules != ''
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.REVIEWER_APP_ID }}
          private-key: ${{ secrets.REVIEWER_APP_PRIVATE_KEY }}
          repositories: ${{ format('{0},{1}', steps.repo.outputs.name, inputs.private_submodules) }}
          permission-contents: read

      # Recursive, because the change can carry submodules of its own: a repository that applies
      # binge-ci's Gradle gates includes them from a binge-ci submodule, and the consumer's build
      # includes this one, so without them the consumer's build cannot configure.
      - name: Check out the change
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: candidate
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: recursive
          token: ${{ steps.submodule_token.outputs.token || github.token }}

      # Submodules are fetched one by one below: the consumer's pin of the calling repository is
      # exactly what this job replaces, so cloning it would be wasted work.
      - name: Check out the consumer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.consumer }}
          ref: ${{ inputs.consumer_ref }}
          path: consumer

      - name: Swap the change in for the consumer's pin
        env:
          CONSUMER: ${{ inputs.consumer }}
          SELF: ${{ github.repository }}
        run: |
          set -euo pipefail
          modules=consumer/.gitmodules
          if [ ! -f "$modules" ]; then
            echo "::error::$CONSUMER has no .gitmodules, so it does not include $SELF as a submodule."
            exit 1
          fi
          # Fixed-string match on the URL's tail, with or without `.git`, over https or ssh.
          key=$(git config -f "$modules" --get-regexp '^submodule\..*\.url$' \
            | awk -v repo="$SELF" '{ u = $2; sub(/\.git$/, "", u); n = length(repo)
                if (substr(u, length(u) - n + 1) == repo && substr(u, length(u) - n, 1) ~ /[\/:]/) print $1 }')
          if [ "$(printf '%s\n' "$key" | grep -c .)" -ne 1 ]; then
            echo "::error::Expected exactly one submodule of $SELF in $CONSUMER's .gitmodules, found: ${key:-none}"
            exit 1
          fi
          path=$(git config -f "$modules" --get "${key%.url}.path")
          echo "$SELF is $CONSUMER's submodule at ${path}/"
          mapfile -t others < <(git config -f "$modules" --get-regexp '^submodule\..*\.path$' \
            | awk -v p="$path" '$2 != p { print $2 }')
          if [ "${#others[@]}" -gt 0 ]; then
            git -C consumer submodule update --init --recursive --depth 1 -- "${others[@]}"
          fi
          rm -rf "consumer/${path}"
          mv candidate "consumer/${path}"

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: ${{ inputs.java_version }}

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          cache-read-only: ${{ inputs.gradle_cache_read_only || (github.event.repository != null && github.ref_name != github.event.repository.default_branch) }}
          cache-cleanup: on-success

      - name: Compile the consumer against this change
        id: compile
        working-directory: consumer
        env:
          TASKS: ${{ inputs.tasks }}
        run: |
          set -euo pipefail
          read -ra tasks <<<"$TASKS"
          ./gradlew "${tasks[@]}" --continue

      - name: Report
        if: ${{ always() }}
        env:
          # The compile step's own outcome, not the job's: a failed mint, checkout or swap leaves it
          # `skipped`, and that is not a compile failure.
          COMPILE: ${{ steps.compile.outcome }}
          CONSUMER: ${{ inputs.consumer }}
          TASKS: ${{ inputs.tasks }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          {
            echo "## ${CONSUMER} against this change (${SHA})"
            echo
            echo "Informational only. This is not a required check."
            echo
            echo "Ran \`${TASKS}\` in the consumer. Its lint, unit tests and screenshot baselines are not run here."
            echo
            case "${COMPILE}" in
              success)
                echo "${CONSUMER} still compiles against this change."
                ;;
              failure)
                echo "The consumer no longer compiles against this change. Its bump PR will need code changes. Expected for an intentional signature change; say so in the PR body."
                ;;
              *)
                echo "The consumer was not compiled: the job stopped before the compile step finished (${COMPILE}). This says nothing about the change. Look at the failed step in the job log: a token mint, a checkout, or the swap."
                ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"
