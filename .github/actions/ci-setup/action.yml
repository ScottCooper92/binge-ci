name: CI setup
description: >
  Shared CI bootstrap — JDK 17, Gradle, the Android SDK, CI-only heap tuning, and the
  TMDB credentials that core/network reads from local.properties. Keeps the build
  and screenshot jobs from duplicating the same five steps. Caching and heap tuning
  both adapt to the runner the job landed on, self-hosted or GitHub-hosted.

inputs:
  tmdb-api-key:
    description: TMDB API key written to local.properties
    required: true
  persistent-gradle-home:
    description: >
      Whether this runner mounts a persistent GRADLE_USER_HOME. When it does, GitHub's Gradle cache
      is a redundant round-trip; when it does not, disabling the cache means resolving the whole
      dependency graph from scratch every run. Verified true for the CI runner (bind mount) and
      false for the agent runners (no mounts at all), so it cannot be inferred from "self-hosted".
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    # RUNNER_ENVIRONMENT is written by the runner, so this follows the machine the job landed
    # on rather than a label a caller must remember to pass. Unrecognised reads as self-hosted.
    - name: Identify the runner
      id: runner
      shell: bash
      run: |
        if [ "${RUNNER_ENVIRONMENT:-}" = "github-hosted" ]; then
          echo "hosted=true" >> "$GITHUB_OUTPUT"
        else
          echo "hosted=false" >> "$GITHUB_OUTPUT"
        fi

        # /proc/meminfo is NOT namespaced: in a container it reports the HOST's RAM, not the
        # container's cap, so a capped runner sizes itself as though it had the whole machine and
        # the cgroup kills the daemon mid-build. Take the smaller of the two.
        mem_gb=$(( $(awk '/^MemTotal:/{print $2}' /proc/meminfo 2>/dev/null || echo 0) / 1024 / 1024 ))
        for f in /sys/fs/cgroup/memory.max /sys/fs/cgroup/memory/memory.limit_in_bytes; do
          [ -r "$f" ] || continue
          limit=$(cat "$f" 2>/dev/null || echo "")
          # v2 writes the literal "max" when uncapped; v1 writes a number near 2^63, which
          # divides down to something absurd rather than failing. Both need excluding.
          case "$limit" in ''|max|*[!0-9]*) continue;; esac
          limit_gb=$(( limit / 1024 / 1024 / 1024 ))
          if [ "$limit_gb" -gt 0 ] && [ "$limit_gb" -lt 1048576 ] && [ "$limit_gb" -lt "$mem_gb" ]; then
            echo "cgroup caps this runner at ${limit_gb} GB (host has ${mem_gb} GB); sizing to the cap."
            mem_gb=$limit_gb
          fi
          break
        done
        # 0 means "not detected", deliberately unresolved here: the two consumers have OPPOSITE
        # safe directions. Undersizing the daemon heap crashes the JVM; oversizing the worker
        # count gets it OOM-killed. No single sentinel is safe for both, so each branch picks.
        echo "mem_gb=$mem_gb" >> "$GITHUB_OUTPUT"

    # SHA-pinned like everything the author workflows run: they execute an agent with Bash,
    # Edit and Write plus a contents:write token, and this action runs inside that boundary.
    - name: Set up JDK 17
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
      with:
        distribution: temurin
        java-version: '17'

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
      with:
        # Persistence is a property of the container, not of "self-hosted", so the caller states
        # it. With a persistent ~/.gradle the cache service is a redundant round-trip; without
        # one it is the difference between resolving the dependency graph once and every run.
        cache-disabled: ${{ steps.runner.outputs.hosted == 'false' && inputs.persistent-gradle-home == 'true' }}

    # Both need it: self-hosted ships no SDK at all, hosted ships one but not this compileSdk.
    - name: Set up Android SDK
      uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
      with:
        log-accepted-android-sdk-licenses: false

    # MUST be written to $GRADLE_USER_HOME, not ~/.gradle. A container that runs the job as
    # root while pinning GRADLE_USER_HOME elsewhere makes ~/.gradle a directory Gradle never
    # reads: the override silently no-ops and the build falls back to the project's own heap,
    # which lint's Kotlin-UAST pass overflows.
    #
    # ParallelGC on both branches: the crash it replaced was a G1 evacuation failure, and a
    # smaller heap makes that likelier, not less.
    - name: Tune Gradle for CI runners
      shell: bash
      run: |
        GUH="${GRADLE_USER_HOME:-$HOME/.gradle}"
        mkdir -p "$GUH"
        # Registry entries from prior ephemeral jobs pile up in a persistent GRADLE_USER_HOME
        # and can never be reused - their container is gone - so every run pays to scan them.
        rm -rf "$GUH/daemon"
        # Same for hs_err files: JAVA_TOOL_OPTIONS points every JVM's -XX:ErrorFile here, and
        # left in place the next crash-diagnostics run re-reports an old crash as this job's.
        rm -f "$GUH"/hs_err_*.log
        tune_gb=${{ steps.runner.outputs.mem_gb }}

        if [ "${{ steps.runner.outputs.hosted }}" = "true" ]; then
          {
            # Sized to what a hosted runner has. Raising either number starts the OOM-killer
            # rather than fixing a slow run.
            echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=768m -XX:+UseParallelGC -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8"
            echo "kotlin.daemon.jvmargs=-Xmx1g"
            # One worker per vCPU. The project's own org.gradle.parallel=true still holds.
            echo "org.gradle.workers.max=2"
          } > "$GUH/gradle.properties"
        elif [ "$tune_gb" -eq 0 ] || [ "$tune_gb" -ge 24 ]; then
          {
            echo "org.gradle.jvmargs=-Xmx10g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8"
            echo "kotlin.daemon.jvmargs=-Xmx2g"
            # Matched to the CPU quota; safe only because ParallelGC replaced G1 above.
            echo "org.gradle.workers.max=5"
          } > "$GUH/gradle.properties"
        else
          # An agent runner also holds the agent process that started the build, so it gets less
          # than a CI runner of the same size. Only reached when memory was detected - undetected
          # takes the branch above, since too small a daemon is the crash, not too big.
          {
            echo "org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8"
            echo "kotlin.daemon.jvmargs=-Xmx1g"
            echo "org.gradle.workers.max=2"
          } > "$GUH/gradle.properties"
        fi
        echo "Gradle tuning written to $GUH/gradle.properties:"
        cat "$GUH/gradle.properties"

    # The screenshot cap is a MEMORY bound, not a CPU one: each module forks a Test JVM plus
    # layoutlib's native heap, competing with the Gradle and Kotlin daemons on the same box. A
    # flat number either wastes a large runner or OOMs a small one, so it is derived from usable
    # memory and self-tunes to whichever runner picks the job up.
    #
    # An undetectable runner falls through to the MIDDLE value, not the generous one: too many
    # workers is the OOM kill, the opposite safe direction to the daemon heap above.
    - name: Size screenshot workers to runner RAM
      shell: bash
      run: |
        mem_gb=${{ steps.runner.outputs.mem_gb }}
        if [ "${{ steps.runner.outputs.hosted }}" = "true" ]; then
          workers=2
        elif [ "$mem_gb" -ge 40 ]; then
          workers=6
        elif [ "$mem_gb" -ge 28 ]; then
          workers=4
        else
          workers=4
        fi
        echo "SCREENSHOT_MAX_WORKERS=$workers" >> "$GITHUB_ENV"
        echo "Screenshot workers: $workers (usable ${mem_gb} GB, hosted=${{ steps.runner.outputs.hosted }})"

    # env-var expansion rather than inline ${{ }}, so the values stay masked if a debug step
    # ever enables set -x.
    - name: Write local.properties
      shell: bash
      env:
        TMDB_API_KEY: ${{ inputs.tmdb-api-key }}
      run: |
        {
          echo "TMDB_API_KEY=$TMDB_API_KEY"
        } > local.properties
