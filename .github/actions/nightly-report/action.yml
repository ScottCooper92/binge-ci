name: Nightly report
description: >
  Keeps one issue open while a run is red, comments on it each red run, and closes it on the next
  green one. The issue's text calls the run "scheduled" unless the caller names its kind.

# A red scheduled run has no PR to carry it, so without this it is a red mark in the
# Actions tab that nothing points at. One issue stays open while the run is red and closes itself
# on the next green one, so an open issue means "still broken", not "old".
#
# The issue is found by its exact title, so each reporting workflow passes a title of its own:
# two sharing one would close each other's issue.
#
# Call it from a job that runs after the gate whatever happened (`if: always()`, and the event is
# `schedule`, or a push when the workflow also reports on one), passing that job's result. Anything but `success` reports: a job that hits its
# timeout is `cancelled`, not `failure`. The job needs `issues: write`.

inputs:
  result:
    description: The result of the job this reports on, as `needs.<job>.result` gives it.
    required: true
  title:
    description: The issue's title, and the identity it is found by.
    required: false
    default: Nightly CI is failing on main
  run-kind:
    description: >
      What the issue's text calls the run: "The <run-kind> run failed". A caller whose job also runs
      on a push passes `run`, since the next green push run closes the issue too.
    required: false
    default: scheduled
  note:
    description: >
      Markdown for a new issue, after the line naming the failed run: what to suspect, and which
      artifact holds the reports. Nothing was pushed to cause a scheduled failure, so this is
      usually the environment; a caller whose run can follow a push should say so instead.
    required: false
    default: Nothing was pushed to cause this, so suspect the environment first.
  labels:
    description: >
      Comma-separated labels for a new issue. When set, the open issue is looked up among issues
      carrying them, so a title shared with an unlabelled issue is not mistaken for this one. The
      labels must already exist in the repository.
    required: false
    default: ''
  assignees:
    description: Comma-separated logins to assign a new issue to.
    required: false
    default: ''
  github-token:
    description: >
      A token with `issues: write`, belonging to a bot: the default `GITHUB_TOKEN` or an app's.
      The open issue is matched only when a bot opened it, so a personal token's issue would
      never be found again and each red run would open another.
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        RESULT: ${{ inputs.result }}
        RUN_KIND: ${{ inputs.run-kind }}
        TITLE: ${{ inputs.title }}
        NOTE: ${{ inputs.note }}
        LABELS: ${{ inputs.labels }}
        ASSIGNEES: ${{ inputs.assignees }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const { RESULT, TITLE, NOTE, LABELS, ASSIGNEES } = process.env;
          const runKind = process.env.RUN_KIND.trim() || 'scheduled';
          const list = (value) => value.split(',').map((s) => s.trim()).filter(Boolean);
          const labels = list(LABELS);
          const assignees = list(ASSIGNEES);
          const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
          const { owner, repo } = context.repo;
          // Opened by a bot too, not only titled the same: on a public repository anyone can open an
          // issue with this title, and a red run would comment on it and a green one close it.
          const open = (await github.paginate(github.rest.issues.listForRepo, {
            owner, repo, state: 'open', per_page: 100,
            ...(labels.length ? { labels: labels.join(',') } : {}),
          })).find((i) => !i.pull_request && i.title === TITLE && i.user?.type === 'Bot');

          if (RESULT === 'success') {
            if (!open) return;
            await github.rest.issues.createComment({
              owner, repo, issue_number: open.number,
              body: `The ${runKind} run is green again: ${runUrl}`,
            });
            await github.rest.issues.update({
              owner, repo, issue_number: open.number, state: 'closed', state_reason: 'completed',
            });
            return;
          }
          if (open) {
            await github.rest.issues.createComment({
              owner, repo, issue_number: open.number,
              body: `Still failing (${RESULT}): ${runUrl}`,
            });
            return;
          }
          await github.rest.issues.create({
            owner, repo, title: TITLE, labels, assignees,
            body: [
              `The ${runKind} run failed (${RESULT}): ${runUrl}`,
              '',
              NOTE,
              '',
              `This issue closes itself on the next green ${runKind} run.`,
            ].join('\n'),
          });
