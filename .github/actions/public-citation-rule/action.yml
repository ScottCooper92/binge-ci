name: Public citation rule
description: >
  The rule an agent prompt carries when it writes text in a PUBLIC repository whose build includes private
  submodules: never cite a private submodule's PR or issue numbers, URLs or file paths. The text of a review, a
  follow-up issue, a reply or a PR body is world-readable there, and quoting the submodule leaks private work.
  Empty when the calling repository is private, or when the caller lists no private submodule, so a prompt that
  includes it is unchanged in those cases.

inputs:
  private-submodules:
    description: The caller's `private_submodules`. Empty means there is nothing private to protect.
    required: false
    default: ''
  token:
    description: A token that can read the calling repository's metadata. The workflow's own token is enough.
    required: false
    default: ${{ github.token }}

outputs:
  block:
    description: The rule, or an empty string when it does not apply.
    value: ${{ steps.rule.outputs.block }}

runs:
  using: composite
  steps:
    # The same test as the submodule-bump script: the caller is taken to be public unless the API says it is
    # private, so a lookup that fails keeps the rule on instead of leaking.
    - name: Decide whether the rule applies
      id: rule
      shell: bash
      env:
        PRIVATE_SUBMODULES: ${{ inputs.private-submodules }}
        GH_TOKEN: ${{ inputs.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        set -euo pipefail
        block=""
        if [ -n "${PRIVATE_SUBMODULES//[[:space:],]/}" ]; then
          private=$(gh api "repos/${GH_REPO}" --jq .private 2> /dev/null) || private=unknown
          if [ "$private" != true ]; then
            block=$(cat <<'RULE'
        This repository is public and its build includes private submodules. What you write here is world-readable:
        a review, a comment, a follow-up issue and a pull request body. In it, never cite a private submodule's pull
        request or issue numbers, URLs or file paths, and never quote its source, its notes or its commit subjects.
        Refer to that code as "the shared library", or by the public name of the API in question. When a point can only
        be explained by quoting the submodule, say what is wrong in this repository's own terms, and leave the
        reference out.
        RULE
            )
            block=$(sed 's/^        //' <<<"$block")
          fi
        fi
        delim="EOF_$(date +%s%N)"
        {
          echo "block<<${delim}"
          printf '%s\n' "$block"
          echo "$delim"
        } >> "$GITHUB_OUTPUT"
        if [ -n "$block" ]; then echo "The public citation rule applies."; else echo "The public citation rule does not apply."; fi
