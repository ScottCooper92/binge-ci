name: Governed paths
description: >
  Exposes restore-agent-governed-paths.sh to a reusable workflow, and reports where
  claude-code-action's rewrite is read from.

# An action rather than a file the workflow reads: a reusable workflow runs against the
# CALLER's checkout, but a local `uses: ./...` inside one resolves against THIS repository,
# so a composite action is the only way to hand a workflow a file that travels with it.
# Same reason ci-setup lives here.
#
# It outputs a path rather than running the script, because its consumers use it from the
# middle of larger shell blocks and in two different shapes - for its restore side-effect,
# and for `--list`.
#
# A PR in a consuming repo cannot edit this file at all, which is the point: it is the guard
# about to discard that PR's own changes to the paths governing an agent.

inputs:
  base-ref:
    description: >
      The ref the governed paths are rewritten FROM: the PR's base, e.g. origin/main. On an
      entity event claude-code-action does the rewrite, from its `base_branch` input, so a
      caller on that path passes it the same branch. On a workflow_run the caller performs the
      rewrite itself (`--rewrite`) from this ref. The undo reads a copy identical to it as the
      rewrite, and anything else as the agent's edit, which it merges onto the PR's copy.
    required: false
    default: origin/main
  default-ref:
    description: >
      The default branch, e.g. origin/main, for a caller whose rewrite claude-code-action
      performs. A copy identical to it is read as the rewrite too: the action falls back to the
      default branch when it has no base, and on a stacked PR the undo would otherwise merge
      that copy's difference from the base onto the branch. Empty for a caller that rewrites
      itself.
    required: false
    default: ''
  extra-paths:
    description: >
      Repo-specific governed paths, newline-separated, APPENDED to the script's own list.
      Append-only: narrowing the list is the silent loss the script exists to prevent.
    required: false
    default: ''

outputs:
  script:
    description: Absolute path to restore-agent-governed-paths.sh.
    value: ${{ steps.locate.outputs.script }}

runs:
  using: composite
  steps:
    - name: Locate the governed-paths script
      id: locate
      shell: bash
      env:
        # The only handle a composite action has on files shipped alongside it.
        ACTION_PATH: ${{ github.action_path }}
        BASE_REF: ${{ inputs.base-ref }}
        DEFAULT_REF: ${{ inputs.default-ref }}
        EXTRA_PATHS: ${{ inputs.extra-paths }}
      run: |
        set -euo pipefail
        script="${ACTION_PATH}/restore-agent-governed-paths.sh"
        [ -f "$script" ] || { echo "::error::restore-agent-governed-paths.sh is missing from $ACTION_PATH."; exit 1; }
        chmod +x "$script"

        # GITHUB_ENV rather than a step output: the script reads these from the environment.
        {
          echo "GOVERNED_BASE_REF=$BASE_REF"
          echo "GOVERNED_DEFAULT_REF=$DEFAULT_REF"
          if [ -n "$EXTRA_PATHS" ]; then
            # A bare `K=v` truncates at the first newline, dropping every path but the first.
            delim="EOF_$(date +%s%N)"
            echo "GOVERNED_EXTRA_PATHS<<${delim}"
            printf '%s\n' "$EXTRA_PATHS"
            echo "$delim"
          fi
        } >> "$GITHUB_ENV"

        echo "script=$script" >> "$GITHUB_OUTPUT"
        # GITHUB_ENV takes effect in the NEXT step, so this call gets the extra paths by hand;
        # without that the log names the script's own list and never the caller's additions.
        echo "Governed paths: $(GOVERNED_EXTRA_PATHS="$EXTRA_PATHS" bash "$script" --list | tr '\n' ' ')"
