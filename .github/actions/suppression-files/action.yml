name: Suppression files
description: >
  Lists a repository's suppression files - the baselines and allowlists that record a known
  failure so a gate passes - as a prompt block an author agent is told not to edit.

# One copy for the three author workflows that take `suppression_files`. Inlined, the same
# script lived in each of them, and a fix to the glob semantics or the fetch had to be made
# three times with nothing to catch a missed copy (#81). Only the LEAD sentence differs
# between them, so it is an input.
#
# Derived here because a caller cannot compute an input: it hands over globs and this lists
# what they match. Read from the default branch as well as the checkout, so a PR cannot hide a
# list from the agent by deleting it.

inputs:
  patterns:
    description: >
      Newline-separated globs. A `*` matches across `/`, so `*-allowlist.txt` matches at any
      depth. Empty lines are ignored, and all-empty yields an empty block.
    required: true
  default-branch:
    description: The branch whose tree is listed alongside the checkout's.
    required: false
    default: main
  lead:
    description: >
      The sentence that introduces the list in the prompt. Each workflow words it for its own
      job: a CI fix, a review reply, a conflict resolution.
    required: true

outputs:
  block:
    description: >
      The lead and the matched files, one per line, ready to splice into a prompt. Empty when
      nothing matched, so a repository with no suppression files adds nothing.
    value: ${{ steps.list.outputs.block }}

runs:
  using: composite
  steps:
    - name: List the suppression files
      id: list
      shell: bash
      env:
        DEFAULT_BRANCH: ${{ inputs.default-branch }}
        PATTERNS: ${{ inputs.patterns }}
        LEAD: ${{ inputs.lead }}
      run: |
        set -euo pipefail
        # Fetched again, not assumed: a shallow checkout has no default-branch tree to list.
        git fetch --quiet origin "$DEFAULT_BRANCH"
        found=$(mktemp)
        # The default branch is read into a scratch index so its tree is matched the same way as
        # the checkout's. A pathspec `*` crosses `/`, so `*-allowlist.txt` matches at any depth.
        scratch=$(mktemp -u)
        GIT_INDEX_FILE="$scratch" git read-tree "origin/${DEFAULT_BRANCH}"
        while IFS= read -r pattern; do
          [ -n "$pattern" ] || continue
          git ls-files -- "$pattern" >> "$found"
          GIT_INDEX_FILE="$scratch" git ls-files -- "$pattern" >> "$found"
        done <<< "$PATTERNS"
        rm -f "$scratch"
        delim="EOF_$(openssl rand -hex 8)"
        {
          echo "block<<${delim}"
          if [ -s "$found" ]; then
            printf '%s\n\n' "$LEAD"
            sort -u "$found" | sed 's/^/  - /'
          fi
          echo "${delim}"
        } >> "$GITHUB_OUTPUT"
