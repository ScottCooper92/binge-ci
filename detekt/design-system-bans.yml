# Bans the raw Material 3 building blocks that the design system wraps, so an app uses the wrapper.
#
# A consumer adds this file to `detektGate { additionalConfigs.from(...) }` from its `binge-ci` submodule, after its own
# `detekt.yml`. detekt reads a later config file over an earlier one, key by key, and a list is replaced, not merged: this file
# owns `ForbiddenImport.forbiddenImports` and `ForbiddenMethodCall.methods`. A consumer whose own `detekt.yml` already sets either
# list (binge-seerr, binge-archive and ephyra set `ForbiddenMethodCall.methods`) loses its entries when it adds this file, and
# nothing reports it. It keeps them by listing them, with this file's entries, in a config file of its own placed after this one
# in `additionalConfigs`. A ban every adopter wants belongs here; one specific to a consumer does not.
#
# The bans cover app code only: the gate reads production source sets only. The design system's own path and build output are
# also excluded, which matters only where it is a directory of the consumer's tree. `ForbiddenImport` catches the import; `ForbiddenMethodCall` catches the call under a wildcard import or a fully
# qualified name, and needs the type resolution the gate wires.
#
# A reviewed exception is an annotation, not a config edit: `@file:Suppress("ForbiddenImport")` on the file that imports it, or
# `@Suppress("ForbiddenMethodCall")` on the function that calls it, with a one-line comment saying why the wrapper does not fit.
# The review bot asks for that line. A new component belongs in the design system, not in the app.

style:
  ForbiddenImport:
    active: true
    excludes: ['**/design-system/**', '**/build/**']
    forbiddenImports:
      - value: 'androidx.compose.material3.TopAppBar'
        reason: 'Use BingeScreenScaffold for a screen bar, BingeTopBar, BingeMediumTopBar or BingeLargeTopBar for a standalone one, BingeSheetTopBar inside a sheet instead of the raw Material TopAppBar. See design-system/docs/components.md.'
