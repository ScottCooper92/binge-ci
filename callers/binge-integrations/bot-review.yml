name: Bot review

# Thin caller. The workflow itself lives in ScottCooper92/binge-ci.
#
# PUBLIC repository. The same-repository guard inside the called workflow is the
# whole boundary here rather than a second line of defence, and the `agent` label
# is maintainers-only for the same reason. Do not add a `pull_request_target` path.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr:
        description: PR number to review
        required: true

# A reusable workflow cannot be granted MORE than its caller holds, and a caller with no
# `permissions:` block gets the repository default - which is `contents: read` and does NOT
# include `actions`. The called workflow needs `actions: read` for its CI-run lookup, so without
# this the run dies as `startup_failure` before a single step executes: no log, no annotation, and
# nothing on the PR.
#
# This is the one way a reusable workflow differs from the copy it replaced. An ordinary workflow
# declaring `permissions: actions: read` simply gets it; a caller has to hold it first. Found by
# running it (binge-seerr#1), not by actionlint, which has no way to see across the reference.
permissions:
  contents: read
  actions: read

jobs:
  review:
    uses: ScottCooper92/binge-ci/.github/workflows/bot-review.yml@v1
    with:
      dispatch_pr: ${{ inputs.pr }}
      # This repo publishes a wire contract other people build against, so what lands
      # on main is read and copied. A bot squash-merging on a green `buf` run is a
      # sharper tool here than on a private app repo.
      auto_merge: false
      # This repo's whole gate is `./gradlew build` plus buf lint/breaking. There is no
      # linter, no coverage floor and no screenshot suite - so naming one here would tell
      # the reviewer not to report what nothing actually catches.
      gated_checks: buf lint, buf breaking, or the Gradle build and its tests
      # ci.yml here declares no paths-ignore, so every PR produces a run and the
      # `labeled` door has nothing to open for. Leaving unbuilt_paths unset keeps it shut.
    secrets:
      REVIEWER_APP_ID: ${{ secrets.REVIEWER_APP_ID }}
      REVIEWER_APP_PRIVATE_KEY: ${{ secrets.REVIEWER_APP_PRIVATE_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
