name: Bot review

# Thin caller. The workflow itself lives in ScottCooper92/binge-ci.
#
# PUBLIC repository. The same-repository guard inside the called workflow is the
# whole boundary here rather than a second line of defence, and the `agent` label
# is maintainers-only for the same reason. Do not add a `pull_request_target` path.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr:
        description: PR number to review
        required: true

jobs:
  review:
    uses: ScottCooper92/binge-ci/.github/workflows/bot-review.yml@v1
    with:
      dispatch_pr: ${{ inputs.pr }}
      # This repo publishes a wire contract other people build against, so what lands
      # on main is read and copied. A bot squash-merging on a green `buf` run is a
      # sharper tool here than on a private app repo.
      auto_merge: false
      gated_checks: buf lint, buf breaking, ktlint or the proto round-trip test
      # ci.yml here declares no paths-ignore, so every PR produces a run and the
      # `labeled` door has nothing to open for. Leaving unbuilt_paths unset keeps it shut.
    secrets:
      REVIEWER_APP_ID: ${{ secrets.REVIEWER_APP_ID }}
      REVIEWER_APP_PRIVATE_KEY: ${{ secrets.REVIEWER_APP_PRIVATE_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
