name: Author - fix failing CI

# Which PR this run is for. A workflow_run run is attributed to the default branch, so without
# this every run of this workflow carries the same branch and the same title, and telling two
# apart means opening one. run-name is evaluated before any job, so it cannot use the number the
# called workflow resolves - it comes off the event, and falls back to the head branch, which is
# what that resolution looks the PR up by anyway.
run-name: >-
  ${{ github.event.workflow_run.pull_requests[0].number
        && format('#{0} · {1}', github.event.workflow_run.pull_requests[0].number, github.event.workflow_run.head_branch)
      || github.event.workflow_run.head_branch
      || github.ref_name }}

# Thin caller. The workflow itself lives in ScottCooper92/binge-ci.
#
# `CI` is matched by NAME - renaming ci.yml's `name:` silently unhooks this, bot-review
# and author-conflicts all at once.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

# A reusable workflow cannot be granted MORE than its caller holds, and a caller with no
# `permissions:` block gets the repository default - which is `contents: read` and does NOT
# include `actions`. The called workflow needs `actions: read` for its CI-run lookup, so without
# this the run dies as `startup_failure` before a single step executes: no log, no annotation, and
# nothing on the PR.
#
# This is the one way a reusable workflow differs from the copy it replaced. An ordinary workflow
# declaring `permissions: actions: read` simply gets it; a caller has to hold it first. Found by
# running it (binge-seerr#1), not by actionlint, which has no way to see across the reference.
permissions:
  contents: read
  actions: read

jobs:
  fix:
    uses: ScottCooper92/binge-ci/.github/workflows/author-ci-fix.yml@v1
    with:
      author_bot_id: ${{ vars.AUTHOR_BOT_ID }}
      toolchain: jvm
      java_version: '21'
      setup_buf: true
      verify_guidance: >
        Verify by running only the check that failed — `buf lint`, `buf breaking`,
        `./gradlew :contracts:test` for the round-trip test. Do not run the whole
        build; CI will do that when you push.
      gate_rules: |
        NEVER silence a gate instead of fixing it. In this repository that
        means, specifically:

          - Do not add exclusions to buf.yaml or buf.work.yaml, and do not add
            `// buf:lint:ignore` comments, to make `buf lint` pass.
          - Do not change or reuse an existing field NUMBER, and do not delete a
            field or an enum value, to make `buf breaking` pass. Evolution inside
            a package is append-only; a breaking change is a new package served
            side by side, and that is a human's decision, not a repair.

        If the only way to green is through one of those, that is a stop: make
        no changes and say so.
    secrets:
      AUTHOR_APP_ID: ${{ secrets.AUTHOR_APP_ID }}
      AUTHOR_APP_PRIVATE_KEY: ${{ secrets.AUTHOR_APP_PRIVATE_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
