name: Bot review

# Which PR this run is for. A workflow_run run is attributed to the default branch, so without
# this every run of this workflow carries the same branch and the same title, and telling two
# apart means opening one. run-name is evaluated before any job, so it cannot use the number the
# called workflow resolves - it comes off the event, and falls back to the head branch, which is
# what that resolution looks the PR up by anyway.
run-name: >-
  ${{ github.event.workflow_run.pull_requests[0].number
        && format('#{0} · {1}', github.event.workflow_run.pull_requests[0].number, github.event.workflow_run.head_branch)
      || github.event.pull_request.number
        && format('#{0} · {1}', github.event.pull_request.number, github.event.pull_request.head.ref)
      || inputs.pr && format('#{0} · dispatched', inputs.pr)
      || github.event.workflow_run.head_branch
      || github.event.issue.number && format('#{0} · rebuttal', github.event.issue.number)
      || github.ref_name }}

# Thin caller. The workflow itself lives in ScottCooper92/binge-ci.
#
# PUBLIC repository, and one that two other builds include directly. `./gradlew build`
# here cannot see every consumer, so a change that compiles fine in this repository can
# still break a consuming app at its next sync. auto_merge was off until the review had a
# track record here. It is on now. The `Consumer check (binge-seerr)` workflow, kept apart from
# `CI`, compiles binge-seerr against a change that touches what it compiles, and a red or pending
# run there holds auto-merge at UNSTABLE. A consumer break that gets through surfaces at that
# consumer's own submodule bump.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  # The third door. `ci.yml` here declares no paths-ignore, so the "CI will never run on this
  # PR" half of this door has nothing to open - see `unbuilt_paths` being left unset below.
  # But the OTHER half is independent of that and does not need `unbuilt_paths` at all: a PR
  # labelled *after* its CI already reported. `workflow_run` above only fires when a matching
  # CI run completes, so a PR whose CI finished inside the minute between opening and labelling
  # closed that door on "not opted in" and is never revisited without this - the called
  # workflow's `resolve` job re-checks CI on the labelled head and reviews it exactly as the
  # `workflow_run` trigger would have.
  #
  # `synchronize` is the re-arm for a PR already labelled: a later push produces a new
  # `workflow_run` of its own, so `synchronize` mostly matters for catching a push that lands
  # while this door's own check is mid-flight. Declared here because a reusable workflow cannot
  # declare its own triggers.
  pull_request:
    types: [labeled, synchronize]
  # An author-bot reply that disagrees with a finding pushes no commit, so no CI run follows
  # it. binge-ci's bot-review keys on the `author-response` marker to re-review it.
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr:
        description: PR number to review
        required: true

# A reusable workflow cannot be granted MORE than its caller holds, and a caller with no
# `permissions:` block gets the repository default - which is `contents: read` and does NOT
# include `actions`. The called workflow needs `actions: read` for its CI-run lookup, so without
# this the run dies as `startup_failure` before a single step executes: no log, no annotation, and
# nothing on the PR.
#
# This is the one way a reusable workflow differs from the copy it replaced. An ordinary workflow
# declaring `permissions: actions: read` simply gets it; a caller has to hold it first. Found by
# running it (binge-seerr#1), not by actionlint, which has no way to see across the reference.
permissions:
  contents: read
  actions: read
  # For the check run the called workflow posts with GITHUB_TOKEN when its first job fails
  # before the reviewer app's token exists - the one report that cannot use the app.
  checks: write

jobs:
  review:
    # Skip the scheduled canary run of CI: it has no PR to review, fix or rebase.
    #
    # A fork PR never reaches the bot. binge-ci refuses one too, and this keeps the guard in sight
    # here (binge-design-system#407). It checks the events that name a head repository and lets the others through.
    if: >-
      (github.event_name != 'workflow_run' || github.event.workflow_run.event != 'schedule') &&
      (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository) &&
      (!github.event.workflow_run || github.event.workflow_run.head_repository.full_name == github.repository)
    uses: ScottCooper92/binge-ci/.github/workflows/bot-review.yml@v1
    with:
      dispatch_pr: ${{ inputs.pr }}
      auto_merge: true
      # A PR CI never builds may merge once approved. Inert here until this repo sets
      # `unbuilt_paths`: with no paths-ignore in ci.yml, every PR gets a build to vouch for it.
      merge_unbuilt: true
      # The screenshot suite belongs in this list: ci.yml runs validateDebugScreenshotTest
      # beside `build`, so a baseline mismatch is already reported and is not the
      # reviewer's to raise.
      gated_checks: ktlint, Android lint or the screenshot baselines
      # unbuilt_paths deliberately left unset: ci.yml here declares no paths-ignore, so there
      # are no CI-less PRs and that half of the labeled/synchronize door (see `on:` above) has
      # nothing to open. The other half - a PR labelled after its CI already went green - needs
      # no `unbuilt_paths` at all, which is why that trigger is wired regardless.
    secrets:
      REVIEWER_APP_ID: ${{ secrets.REVIEWER_APP_ID }}
      REVIEWER_APP_PRIVATE_KEY: ${{ secrets.REVIEWER_APP_PRIVATE_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
