name: Device round trip (minified)

# The SDK's own emulator lane: bind, handshake and one rpc on each contract across a real Binder, on
# a build shrunk the way a consumer's release build is. Its own workflow, not a job in ci.yml: the
# emulator takes many minutes, and the bots read ci.yml by name. See device-smoke.yml in binge-ci.
#
# expected_tests names the round trips: a test filtered out by mistake is a failure, not a smaller
# green run.
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'contracts/**'
      - 'sdk/**'
      - 'minify-check/**'
      - 'gradle/libs.versions.toml'
      - '.github/workflows/device-round-trip.yml'
  push:
    branches: [main]
    paths:
      - 'contracts/**'
      - 'sdk/**'
      - 'minify-check/**'
      - 'gradle/libs.versions.toml'
      - '.github/workflows/device-round-trip.yml'

concurrency:
  group: device-round-trip-${{ github.ref }}
  cancel-in-progress: true

# actions: write is for the AVD cache save, which deletes the previous entry first. The called
# workflow cannot hold more than this.
permissions:
  contents: read
  actions: write

jobs:
  round-trip:
    name: Round trip over Binder on a minified build
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    uses: ScottCooper92/binge-ci/.github/workflows/device-smoke.yml@v1
    with:
      timeout_minutes: 60
      java_version: '21'
      module: ':minify-check'
      device: roundTripAtdApi34
      api_level: '34'
      system_image_source: aosp-atd
      default_branch: main
      tasks: ':minify-check:roundTripAtdApi34MinifiedAndroidTest'
      results_dir: minify-check/build/outputs/androidTest-results/managedDevice/minified
      expected_tests: >-
        requestHandshakesAnswersAndRefusesWithAUserMessage
        libraryHandshakesAndAnswersWithATimestamp
        streamHandshakesAndAnswers
      artifact_name: device-round-trip-results
      artifact_paths: |
        minify-check/build/reports/androidTests/**
        minify-check/build/outputs/androidTest-results/**
