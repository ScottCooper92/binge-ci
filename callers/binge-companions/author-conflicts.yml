name: Author - resolve merge conflicts

# What set this run off. This one sweeps every conflicted PR rather than acting on one, so it is
# named for the branch whose CI finished - a PR number here would name whichever PR happened to be
# first in the matrix. Without it, a workflow_run run reads as the default branch every time.
run-name: >-
  ${{ github.event.workflow_run.head_branch
        && format('sweep after {0}', github.event.workflow_run.head_branch)
      || 'sweep · dispatched' }}

# Thin caller. The workflow itself lives in ScottCooper92/binge-ci.
#
# PUBLIC repository: the fork filter inside the scan is the control here, not a
# formality. The `agent` label stays maintainers-only.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:

jobs:
  resolve:
    uses: ScottCooper92/binge-ci/.github/workflows/author-conflicts.yml@v1
    with:
      dispatched: ${{ github.event_name == 'workflow_dispatch' }}
      author_bot_id: ${{ vars.AUTHOR_BOT_ID }}
      # No governed_extra_paths: the base list in binge-ci's governed-paths action
      # covers what claude-code-action rewrites, and this repo has nothing beyond
      # it. `.ai/` is not rewritten by the action, so it does not belong here.
      conflict_rules: |
        A conflict in a `.proto` file is rarely yours to arbitrate. Field
        NUMBERS are the wire format: two sides that assigned the same number to
        different fields have made incompatible decisions, and picking one
        silently breaks every peer built against the other. Keep both fields
        with distinct numbers if that is plainly what was meant; otherwise leave
        it unresolved and say so in note.md.

        Never renumber or reuse an existing field number to resolve a conflict,
        and never delete a field to make one go away - the contract is
        append-only inside a package, and `buf breaking` will fail the build
        rather than let it through.
    secrets:
      AUTHOR_APP_ID: ${{ secrets.AUTHOR_APP_ID }}
      AUTHOR_APP_PRIVATE_KEY: ${{ secrets.AUTHOR_APP_PRIVATE_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
