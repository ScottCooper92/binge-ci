name: Author - catch up a retargeted PR

# Which PR this run is for. This one triggers on pull_request_target, so unlike the workflow_run
# bots its run is already associated with the PR; the title still helps in the Actions list, where
# the runs otherwise differ only by timestamp.
run-name: >-
  ${{ github.event.pull_request.number
        && format('#{0} · {1}', github.event.pull_request.number, github.event.pull_request.head.ref)
      || github.ref_name }}

# Thin caller. The workflow itself lives in ScottCooper92/binge-ci.
#
# `pull_request_target`, NOT `pull_request`, and this is load-bearing: a
# `pull_request` workflow is read from the PR's HEAD branch, so it could never run
# for a PR whose branch predates it - which is circular, because the branch acquires
# it by the very merge this workflow performs. See the called workflow's header for
# why the trigger's usual hazard does not apply to it, and for why no execution step
# may ever be added there.
#
# Do NOT add a `concurrency:` block here - the called workflow has one, keyed per PR.
on:
  pull_request_target:
    # `edited` covers a base change. `ready_for_review` covers a stack opened as
    # drafts and promoted one at a time - a draft retargeted while staged has no other
    # moment to be caught up. `opened` and `labeled` cover a PR opened onto a base
    # that had already merged, where there is no base change for `edited` to carry;
    # both, because `gh pr create` then `gh pr edit --add-label` is two calls and
    # `opened` fires before the label lands.
    types: [opened, labeled, edited, ready_for_review]

jobs:
  catch-up:
    uses: ScottCooper92/binge-ci/.github/workflows/author-retarget.yml@v1
    with:
      author_bot_id: ${{ vars.AUTHOR_BOT_ID }}
    secrets:
      AUTHOR_APP_ID: ${{ secrets.AUTHOR_APP_ID }}
      AUTHOR_APP_PRIVATE_KEY: ${{ secrets.AUTHOR_APP_PRIVATE_KEY }}
