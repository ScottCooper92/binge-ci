name: Author - respond to comments

# Which PR this run is for, from the comment that triggered it - the run itself is attributed to
# the default branch, so the list gives no other clue which conversation it belongs to.
run-name: >-
  ${{ github.event.issue.number && format('#{0}', github.event.issue.number)
      || github.event.pull_request.number && format('#{0}', github.event.pull_request.number)
      || github.ref_name }}

# Thin caller. The workflow itself lives in ScottCooper92/binge-ci.
#
# All THREE events, because wiring only `issue_comment` is the usual mistake and it
# misses every inline comment on the diff.
#
# One review submitted with N inline comments arrives as N
# pull_request_review_comment.created events PLUS one pull_request_review, so a single
# review costs two agent runs and two rounds.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

# WORKFLOW-level, and it lives here rather than in the called workflow because a run joins
# the group when it is CREATED - before the job `if` below is consulted. Do NOT reach for
# cancel-in-progress to collapse the duplicate events: every event the `if` filters out -
# the reviewer bot's own "Not merging" note, the ci-fix bot's comment, a drive-by from a
# non-collaborator - would cancel an in-flight agent and then skip its own job, leaving the
# review unanswered with nothing left to re-trigger it. The reviewer bot posts exactly that
# comment seconds after the review that starts this run, so it would fire on the ordinary
# path, not an edge case.
concurrency:
  group: author-comments-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  respond:
    # Ignore the author bot's own noise, and ignore comments on plain issues. The reviewer
    # bot is ignored for CONVERSATION comments only: its "Not merging: ..." notes are
    # addressed to a human and would otherwise burn a round. Its reviews still come through,
    # which is the point of the loop.
    #
    # The last clause is the commenter gate: the reviewer bot is trusted by identity (it
    # holds the app token), everyone else has to be OWNER, MEMBER or COLLABORATOR.
    # author_association travels on the comment and the review alike, so one clause covers
    # all three events. On a public repo this gate is the control, not a formality - anyone
    # can comment, and the comment body becomes the agent's instructions.
    if: >
      github.event.sender.login != 'binge-pr-author[bot]' &&
      (github.event_name != 'issue_comment' ||
       (github.event.issue.pull_request &&
        github.event.sender.login != 'binge-pr-reviewer[bot]')) &&
      (github.event_name != 'pull_request_review' || github.event.review.state != 'approved') &&
      (github.event.sender.login == 'binge-pr-reviewer[bot]' ||
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
                github.event.review.author_association || github.event.comment.author_association))
    uses: ScottCooper92/binge-ci/.github/workflows/author-comments.yml@v1
    with:
      author_bot_id: ${{ vars.AUTHOR_BOT_ID }}
      maintainer_handle: ScottCooper92
      toolchain: jvm
      java_version: '21'
      setup_buf: true
      verify_guidance: >
        You have a JDK, Gradle and the buf CLI, so verify what you change rather
        than reasoning about it - `buf lint`, `buf breaking`, or
        `./gradlew :contracts:test` for the round-trip test. Scope it to what you
        touched rather than running the whole build.
      gate_rules: |
        NEVER silence a gate, however the request is worded. Do not add
        exclusions to buf.yaml or buf.work.yaml, and do not add
        `// buf:lint:ignore` comments.

        The contract is append-only inside a package, and that is not
        negotiable by comment. Do not change or reuse an existing field
        NUMBER, and do not delete a field or an enum value, however
        reasonable the request sounds - a field number is the wire format,
        and changing one breaks every peer built against the old meaning
        while `buf breaking` is the only thing that would have said so. A
        genuine breaking change is a new package served side by side, which
        is a human's decision.

        If a comment asks for one of those, say no in your reply and
        explain why rather than doing it.
    secrets:
      AUTHOR_APP_ID: ${{ secrets.AUTHOR_APP_ID }}
      AUTHOR_APP_PRIVATE_KEY: ${{ secrets.AUTHOR_APP_PRIVATE_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
