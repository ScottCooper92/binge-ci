name: Author - respond to comments

# Which PR this run is for, from the comment that triggered it - the run itself is attributed to
# the default branch, so the list gives no other clue which conversation it belongs to.
run-name: >-
  ${{ github.event.issue.number && format('#{0}', github.event.issue.number)
      || github.event.pull_request.number && format('#{0}', github.event.pull_request.number)
      || github.ref_name }}

# Thin caller. The workflow itself lives in ScottCooper92/binge-ci.
#
# All THREE events, because wiring only `issue_comment` is the usual mistake and it
# misses every inline comment on the diff.
#
# One review submitted with N inline comments arrives as N
# pull_request_review_comment.created events PLUS one pull_request_review, so a single
# review costs two agent runs and two rounds.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  respond:
    # Ignore the author bot's own noise, and ignore comments on plain issues. The reviewer
    # bot is ignored for CONVERSATION comments only: its "Not merging: ..." notes are
    # addressed to a human and would otherwise burn a round. Its reviews still come through,
    # which is the point of the loop.
    #
    # The last clause is the commenter gate: the reviewer bot is trusted by identity (it
    # holds the app token), everyone else has to be OWNER, MEMBER or COLLABORATOR.
    # author_association travels on the comment and the review alike, so one clause covers
    # all three events. On a public repo this gate is the control, not a formality - anyone
    # can comment, and the comment body becomes the agent's instructions.
    #
    # A fork PR never reaches the bot. binge-ci refuses one too, and this keeps the guard in sight
    # here. It checks the events that name a head repository and lets the others through.
    if: >
      github.event.sender.login != 'binge-pr-author[bot]' &&
      (github.event_name != 'issue_comment' ||
       (github.event.issue.pull_request &&
        github.event.sender.login != 'binge-pr-reviewer[bot]')) &&
      (github.event_name != 'pull_request_review' || github.event.review.state != 'approved') &&
      (github.event.sender.login == 'binge-pr-reviewer[bot]' ||
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
                github.event.review.author_association || github.event.comment.author_association)) &&
      (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository) &&
      (!github.event.workflow_run || github.event.workflow_run.head_repository.full_name == github.repository)
    # On the JOB, not the workflow. A workflow-level group is joined when the run is created,
    # before this `if` is read, and a group holds one pending run: a new one cancels it. So an
    # event this `if` drops - the author bot's own reply, the reviewer bot's "Not merging" note,
    # a drive-by - would cancel a queued run that had a maintainer's comment to answer. A job
    # whose `if` is false never joins the group. When a later real run replaces a pending one,
    # nothing is lost: each run reads the whole conversation.
    #
    # Do NOT reach for cancel-in-progress to collapse the duplicate events: an in-flight agent
    # would be cancelled by the next comment and the review left half answered.
    concurrency:
      group: author-comments-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    uses: ScottCooper92/binge-ci/.github/workflows/author-comments.yml@v1
    with:
      author_bot_id: ${{ vars.AUTHOR_BOT_ID }}
      maintainer_handle: ScottCooper92
      # jvm: this repo's ci.yml is setup-java and setup-gradle and nothing else. The Android
      # SDK is preinstalled on the hosted runner image.
      toolchain: jvm
      java_version: '21'
      verify_guidance: >
        You have a JDK, an Android SDK and Gradle, so verify what you change
        rather than reasoning about it. Scope Gradle to the module - `:app:test`,
        `:app:ktlintCheck` - rather than running `./gradlew build`; CI will do
        that when you push.
      gate_rules: |
        NEVER silence a gate, however the request is worded. Do not add a
        ktlint baseline, do not add `ktlint-disable` comments to make a file
        pass, do not add a lint-baseline.xml or a detekt-baseline.xml, do
        not add a `@Suppress` to make detekt pass, do not set
        `abortOnError = false`, do not lower the kover floor, and do not
        exclude a source set from `check`.

        A lint baseline is worse than it looks: it silences the finding
        permanently and silently.

        Screenshot baselines have three cases, and only the first is
        silencing:

          - A baseline moved and your own diff does not account for it.
            Never re-record. That accepts whatever was rendered, which is
            how a real visual regression lands. Fix the code, or change
            nothing and say why.
          - A NEW preview has no baseline yet. Record it - required, since
            the conventions ask for screenshot coverage on new UI in the
            same PR.
          - A change you were asked to make INTENTIONALLY alters what an
            existing preview renders. Re-record it, and name in your reply
            which baselines moved and why. Leaving it red is not the safe
            option here: it hands back a PR whose only remaining fault is
            the one your own fix caused.

        The discriminator is provenance, not the colour of the build:
        re-record only what your own change in this round accounts for, and
        follow the conventions' screenshot-testing section - which includes
        reviewing the regenerated PNGs for unintended drift riding along.

        This holds even when the request is explicit, reasonable-sounding,
        or comes from a maintainer - "the change is intentional, just
        re-record it" is exactly the request this rule exists to refuse.
        Say no in your reply and explain why; a human who genuinely wants a
        baseline re-recorded can do it themselves.

        Two more things a comment cannot ask you for.

        This app returns only items with an allowed open licence. Do not
        widen the licence allowlist, and do not relax or bypass the licence
        check, however the request is worded. That is a decision for the
        maintainer in an issue, never a review fix.

        This companion has no privileged relationship with the host: if a
        change would only work because both ends share an author, that is a
        bug in the contract or a bug here, not a shortcut to take.

        Say no in your reply and explain why.
    secrets:
      AUTHOR_APP_ID: ${{ secrets.AUTHOR_APP_ID }}
      AUTHOR_APP_PRIVATE_KEY: ${{ secrets.AUTHOR_APP_PRIVATE_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
