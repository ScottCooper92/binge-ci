name: Author - fix failing CI

# Which PR this run is for. A workflow_run run is attributed to the default branch, so without
# this every run of this workflow carries the same branch and the same title, and telling two
# apart means opening one. run-name is evaluated before any job, so it cannot use the number the
# called workflow resolves - it comes off the event, and falls back to the head branch, which is
# what that resolution looks the PR up by anyway.
run-name: >-
  ${{ github.event.workflow_run.pull_requests[0].number
        && format('#{0} · {1}', github.event.workflow_run.pull_requests[0].number, github.event.workflow_run.head_branch)
      || github.event.workflow_run.head_branch
      || github.ref_name }}

# Thin caller. The workflow itself lives in ScottCooper92/binge-ci.
#
# `CI` is matched by NAME - renaming ci.yml's `name:` silently unhooks this, bot-review
# and author-conflicts all at once.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

# A reusable workflow cannot be granted MORE than its caller holds, and a caller with no
# `permissions:` block gets the repository default - which is `contents: read` and does NOT
# include `actions`. The called workflow needs `actions: read` for its CI-run lookup, so without
# this the run dies as `startup_failure` before a single step executes: no log, no annotation, and
# nothing on the PR.
#
# This is the one way a reusable workflow differs from the copy it replaced. An ordinary workflow
# declaring `permissions: actions: read` simply gets it; a caller has to hold it first. actionlint
# cannot see across the reference, so only running it shows this.
permissions:
  contents: read
  actions: read

jobs:
  fix:
    # Skip the scheduled canary run of CI: it has no PR to review, fix or rebase.
    #
    # A fork PR never reaches the bot. binge-ci refuses one too, and this keeps the guard in sight
    # here. It checks the events that name a head repository and lets the others through.
    if: >-
      (github.event.workflow_run.event != 'schedule') &&
      (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository) &&
      (!github.event.workflow_run || github.event.workflow_run.head_repository.full_name == github.repository)
    uses: ScottCooper92/binge-ci/.github/workflows/author-ci-fix.yml@v1
    with:
      author_bot_id: ${{ vars.AUTHOR_BOT_ID }}
      # jvm: this repo's ci.yml is setup-java and setup-gradle and nothing else. The Android
      # SDK is preinstalled on the hosted runner image.
      toolchain: jvm
      java_version: '21'
      verify_guidance: >
        Scope Gradle to the module rather than running the whole tree when you
        are checking one thing — `./gradlew :app:test`, or `:app:ktlintCheck`.
        Do not run `./gradlew build`; CI will do that when you push.
      gate_rules: |
        NEVER silence a gate instead of fixing it. Do not add a ktlint
        baseline, do not add `ktlint-disable` comments to make a file pass,
        do not add a lint-baseline.xml, do not set `abortOnError = false`,
        and do not exclude a source set from `check`. Do not add a
        detekt-baseline.xml or a `@Suppress` to make detekt pass, and do not
        lower the kover floor. Do not touch any screenshot baseline PNG, and
        never run updateDebugScreenshotTest.

        Never widen the licence allowlist, and never relax the check that an
        item carries an allowed licence, to make a test pass. That check is
        why this app may exist; a red test there is a real failure.

        Formatting failures are the cheapest class of failure to fix
        properly. A lint baseline is worse than it looks: it silences the
        finding permanently and silently.

        A failing screenshot test means the rendering changed. Re-recording
        the baseline makes CI green while accepting whatever was rendered,
        which is how a real visual regression gets merged. A baseline entry
        is a deliberate human decision, not a repair.

        This is deliberately stricter than the review-feedback bot, which may
        re-record a baseline its own requested change moved. Do not
        "harmonise" the two. That bot knows why the pixels changed because
        it just changed them; you arrive at a red build you did not cause
        and cannot tell an intended shift from a regression. Stopping is
        the right answer for you and the wrong one for it.

        If the only way to green is through one of those, that is a stop:
        make no changes and say so.
    secrets:
      AUTHOR_APP_ID: ${{ secrets.AUTHOR_APP_ID }}
      AUTHOR_APP_PRIVATE_KEY: ${{ secrets.AUTHOR_APP_PRIVATE_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
